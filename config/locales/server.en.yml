en:
  sms:
    errors:
      phone_invalid: "Enter a valid phone number in international format, for example +8613800138000."
      phone_taken: "This phone number is already linked to another account."
      code_invalid_format: "Enter the verification code from the SMS."
      code_not_requested: "Request a verification code before verifying."
      current_phone_not_bound: "No phone number is bound to this account."
      current_phone_verification_required: "Verify your current phone number before changing it."
      current_phone_mismatch: "The verification code was requested for a different phone number."
      code_expired: "The verification code has expired. Request a new code."
      code_invalid: "The verification code is incorrect."
      too_many_attempts: "Too many verification attempts. Request a new code."
      captcha_not_configured: "Captcha is not enabled or not fully configured. Phone verification is unavailable until an administrator enables Captcha."
      captcha_failed: "Captcha verification failed. Please try again."
      captcha_unavailable: "Captcha verification is temporarily unavailable. Please try again later."
      provider_not_configured: "The SMS provider is not configured. Please contact the site administrator."
      provider_unavailable: "The SMS provider is currently unavailable. Please try again later."
      provider_rejected: "The SMS provider rejected the request: %{message}"
      provider_rejected_generic: "The SMS provider rejected the request."

  site_settings:
    sms_enabled: "Enable phone number verification through an external SMS provider."
    sms_require_captcha: "Require a Captcha challenge before an SMS verification code is sent. It is strongly recommended to keep this enabled. Requires the discourse-captcha plugin to be enabled and configured."
    sms_require_phone_binding: "Require members to bind a verified phone number before creating topics, replies, or private messages. Reading remains available."
    sms_skip_phone_binding_groups: "Groups whose members can skip the phone binding requirement."
    sms_skip_phone_binding_usernames: "Usernames that can skip the phone binding requirement. Separate multiple usernames with commas or <code>|</code>."
    sms_send_api_url: "URL of the external API that sends an SMS verification code. The request body contains the phone number."
    sms_verify_api_url: "URL of the external API that verifies an SMS verification code. The request body contains the phone number and the code."
    sms_auth_token: "Token sent with every SMS API request. Leave blank if the provider does not require authentication."
    sms_auth_header: "HTTP header used to send the token, for example <code>Authorization</code>."
    sms_auth_scheme: "Scheme prepended to the token, for example <code>Bearer</code>. Leave blank to send the raw token."
    sms_request_format: "Encoding of the request body sent to the SMS provider."
    sms_request_timeout_seconds: "Timeout in seconds for each SMS provider request."
    sms_phone_param: "Name of the phone number field in the SMS provider request body."
    sms_code_param: "Name of the verification code field in the verification request body."
    sms_purpose: "Value sent as <code>purpose</code> in every request. Leave blank to omit the field."
    sms_extra_params: "Optional JSON object merged into every SMS provider request, for example <code>{\"appId\":\"123\"}</code>."
    sms_default_country_code: "Country calling code used when a member enters a phone number without a leading <code>+</code>."
    sms_code_ttl_minutes: "How long a verification code may be used."
    sms_resend_interval_seconds: "Minimum number of seconds between two verification codes for the same account. Set to 0 to disable this cooldown."
    sms_max_verification_attempts: "Maximum number of failed verification attempts for a single code."
    sms_max_sends_per_hour: "Maximum number of codes that may be sent per account and per phone number each hour."
    sms_send_success_json_path: "Optional dot-separated JSON path that marks a send request as successful, for example <code>code</code> or <code>data.success</code>."
    sms_send_success_value: "Expected value at the send success JSON path. Leave blank to accept any truthy value. When the path is blank, any 2xx response is treated as success."
    sms_verify_success_json_path: "Optional dot-separated JSON path that marks a verification request as successful, for example <code>valid</code> or <code>data.valid</code>."
    sms_verify_success_value: "Expected value at the verification success JSON path. Leave blank to accept any truthy value. When the path is blank, any 2xx response is treated as success."
    sms_error_message_json_path: "Optional dot-separated JSON path used to read the error message from a provider response, for example <code>message</code> or <code>data.message</code>."
    sms_debug_logging: "Log SMS provider request status codes and durations to the Discourse log."
